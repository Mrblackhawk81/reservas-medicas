<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - MedCenter</title>

    <meta 
        name="description"
        content="Inicia sesión para gestionar tus citas medicas en MedCenter.">

    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <main class="login-container">
        <section class="login-card">
            <header class="login-header">

                <h1>MedCenter</h1>
                <h2>Iniciar sesión</h2>
                <P> 
                    Accede a tu cuenta para gestionar tus citas medicas.
                </P>

            </header>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">
                        Correo electrónico
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="correo@ejemplo.com" 
                        autocomplete="email"
                        required>
                </div>

                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="********"
                        autocomplete="current-password"
                        required>

                </div>

                <div class="form-options">

                    <label>

                        <input
                            type="checkbox"
                            id="remember"
                            name="remember">

                        Recordarme

                    </label>

                    <a href="#">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>

                <button
                    type="submit"
                    class="btn-primary">
                    Iniciar sesión
                </button>

            </form>

            <footer class="login-footer">

                <p>
                    ¿No tienes una cuenta?
                    <a href="register.html">
                        Regístrate
                    </a>
                </p>

                <a href="index.html">

                    ← Volver al inicio
                </a>

            </footer>

        </section>
</body>
</html>
