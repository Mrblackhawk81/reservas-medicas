<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediReserva - Reserva de citas médicas</title>
    <meta name="description" content="Plataforma en línea que permite a los pacientes reservar citas médicas de manera rápida y sencilla.">
</head>
<body>

    <header id="header">
        <div class="logo">
            <h1>MediReserva</h1>
        </div>
        <nav id="main-nav">
            <ul>
                <li><a href="#home">Inicio</a></li>
                <li><a href="#especialidades">Especialidades</a></li>
                <li><a href="#reservas">Reservas</a></li>
                <li><a href="#mis-citas">Mis Citas</a></li>
                <li><a href="#login">Iniciar sesión</a></li>
                <li><a href="#register">Registrarse</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="inicio" class="hero">
            <h2>Reserva tu cita médica</h2>
            <p>atencion Profesional, rapida y cerca de ti.</p>
            <a href="#reservar" class="btn-primary">Reservar ahora</a>
        </section>

        <section id="especialidades">
            <h2>Especialidades médicas</h2>
            <div class="especialidades-grid">
            </div>
        </section>

        <section id="doctores">
            <h2>Nuestros doctores</h2>
            <div class="doctores-grid">
            </div>
        </section>

        <section id="reservar">
            <h2>Reservar una cita</h2>
            <form id="form-reserva">
                <fieldset>
                    <legend>Información del paciente</legend>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>

                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" required>
                </fieldset>
            </form>
        </section>
    </main>

</body>
</html>
